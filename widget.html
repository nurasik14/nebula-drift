<style>
body{margin:0;padding:10px 12px max(10px,env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
#h,#f{display:flex;align-items:center;justify-content:space-between;margin-left:8px}
#h{font-weight:600}
#h b{font-size:13px;letter-spacing:.32em}
i,#y{font:13px system-ui;color:var(--tg-theme-hint-color)}
#w{position:relative;margin:6px 0 8px}
canvas{display:block;width:100%;aspect-ratio:1;max-height:300px;touch-action:none}
#o{position:absolute;top:0;bottom:0;width:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;pointer-events:none}

#g{display:flex;padding:2px;border-radius:9px;background:var(--tg-theme-secondary-bg-color)}

#g .on{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
#l{margin:8px 0 0 8px;font-size:13px;white-space:pre-line}
</style>
<div id="h"><b>ORBIT</b><span id="s"></span></div>
<div id="w"><canvas id="c"></canvas><div id="o"></div></div>
<div id="f"><div id="g"><button id="d" onclick="sm('d')">Daily</button><button id="e" onclick="sm('e')">Endless</button></div><span id="y"></span></div>
<div id="l"></div>
<script>
const T=window.TelegramWidget,$=i=>document.getElementById(i),M=Math,P=M.PI*2,c=$('c'),x=c.getContext('2d'),
N=()=>document.createElement('canvas'),G=N(),g=G.getContext('2d'),S=N(),s=S.getContext('2d'),
L=T&&!T.isPreview&&!T.isForward,U=32,R=[],C=i=>U*i+16,pt=(a,r)=>[X+M.cos(a)*r,Y+M.sin(a)*r],ah=a=>((a-A)*dr%P+P*1.5)%P-P/2,
ui=()=>$('s').innerHTML=sc+' <i>best '+best+'</i>',ov=h=>$('o').innerHTML=h,y=q=>$('y').textContent=q,
ls=(k,v)=>{try{if(v==null)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}},hp=(f,a)=>{try{T.HapticFeedback[f](a)}catch(e){}},
rr=()=>R[fr]+(R[rg]-R[fr])*M.sin(M.min(hT/.09,1)*1.571),add=n=>{sc+=n*mu;ui()},nr=e=>{e.n=1;nm++;nf=0;add(25);hp('impactOccurred','rigid')},
sp=(i,a,b,z)=>{z=16*(z||1);x.drawImage(S,U*i*D,0,U*D,U*D,a-z,b-z,2*z,2*z)},fx=(i,a,b,k,m)=>{if(k<.3){x.globalAlpha=1-k/.3;sp(i,a,b,.35+k*m);x.globalAlpha=1}};
let W,H,D,X,Y,K,st=0,md,rn,A=0,dr,fr,rg,hT,hd,Dd,t,ph,sc=0,nm,cb,mu,E,ev,lm,lh,cp,fl,nf,pl,td,hx,hy,lt=0,ac=0,gn=0,ru=0,day,cd,best=0,pend;
function th(){let p=T&&T.themeParams||{},f=(k,d)=>p[k+'_color']||d;
K={t:f('text','#333'),h:f('hint','#999'),b:f('button','#38e'),a:f('accent_text','#38e'),r:f('destructive_text','#e43')}}
function ar(q,a,b,r,k,l){q.beginPath();q.arc(a,b,r,0,P);if(l){q.lineWidth=l;q.strokeStyle=k;q.stroke()}else{q.fillStyle=k;q.fill()}}
function bake(){let q=H/2,u=R[1]+16;cv(g,H,H);g.globalAlpha=.35;
g.setLineDash([1,P*u/72-1]);ar(g,q,q,u,K.h,5);g.setLineDash([]);ar(g,q,q,17,K.h,1);g.globalAlpha=.75;ar(g,q,q,R[0],K.h,1.5);ar(g,q,q,R[1],K.h,1.5);
cv(s,U*8,U);
ar(s,C(0),16,4.5,K.b);ar(s,C(0),16,8,K.b,1);ar(s,C(1),16,5.5,K.a,1.5);ar(s,C(1),16,2,K.a);
s.beginPath();s.moveTo(C(2),10);s.lineTo(C(2)+6,16);s.lineTo(C(2),22);s.lineTo(C(2)-6,16);s.fillStyle=K.r;s.fill();
ar(s,C(3),16,4,K.r);ar(s,C(4),16,6,K.t);ar(s,C(4),16,10,K.h,1);
ar(s,C(5),16,13,K.b,1.5);ar(s,C(6),16,13,K.a,2);ar(s,C(7),16,2.2,K.b)}
function cv(k,w,h){k.canvas.width=w*D;k.canvas.height=h*D;k.setTransform(D,0,0,D,0,0)}
function sz(){W=c.clientWidth||300;H=M.min(W,300);D=M.min(2,devicePixelRatio||1);cv(x,W,H);x.font='600 11px system-ui';x.textAlign='center';
X=W/2;Y=H/2;R[0]=Y*.56;R[1]=Y*.84;bake();dw()}
function id(){ov(L?'<b>Tap to start</b><i>tap to switch rings</i><i>'+(md=='d'?'daily run, same for all':'endless run')+'</i>'+(cd.c?'<i>beat '+(+cd.c)+'</i>':''):'<b>ORBIT</b><i>play in @fameOfBot</i>')}
function go(){day=new Date().toISOString().slice(0,10).replace(/-/g,'');
let a=md=='d'?+day:M.random()*2e9+1|0;rn=()=>(a=a*16807%2147483647)/2147483647;
st=1;t=Dd=sc=nm=cb=cp=lh=pl=ev=0;ph=mu=dr=fr=rg=1;A=-P/4;hd=-9;E=[];lm=1.5;nf=fl=hT=9;ov('');ui()}
function over(){st=3;let n=sc>best,q='s:'+md+':'+day+':'+sc+':'+nm;if(n)ls('b',best=sc);
if(!pend||sc>=+pend.split(':')[3])ls('p',pend=q);ui();
ov('<b>'+sc+'</b><i>'+(n?'new best':'best '+best)+'</i><i>phase '+ph+' · near misses '+nm+'</i>');rq(pend)}
function step(q){if(st>1&&(td+=q)>.8&&st<3)over();
if(st-1){A+=.15*q;return}
t+=q;hT+=q;nf+=q;fl+=q;pl-=q;cp=M.max(0,cp-q*4);
let w=M.min(1.7+t*.028,3.3),v=w*q,p=hT>.045?rg:fr,d,k,h,l;A+=dr*v;Dd+=v;
if(t>ph*20){ph++;dr=-dr;E=[];ev=fl=0;pl=1.6;lm=Dd+w}
if(!ev){k=M.min(rn()*(ph>3?3.4:ph)|0,2);h=k-2?.08:.4;l=k==1?1.7:k?M.max(1.6,.8*w)+h:2.2;
lm=M.max(lm+(.3+rn()*.5+.25/ph)*w+h+lh,Dd+l);lh=h;ev={k,l,r:rn()*2|0,s:rn()<.6,m:lm}}
if(Dd>=ev.m-ev.l){d=ev.m-Dd;k=ev.k;E.push({k,r:ev.r,a:A+dr*d*(k==1?1.7:1),h:k-2?8/R[ev.r]:.4,t:0});
if(ev.s)E.push({k:3,r:1-ev.r,a:A+dr*d,t:0});ev=0}
E=E.filter(e=>{e.t+=q;if(e.k==1)e.a-=dr*.7*v;d=ah(e.a);
if(e.k>2){if(e.r==p&&M.abs(d)<.13){cb++;mu=M.min(5,1+cb/4|0);cp=1;hp('impactOccurred','light');add(10);return 0}if(d<-.2)cb=0,mu=1;return d>-.2}
if(e.r==p&&M.abs(d)<e.h&&(e.k<2||e.t>.6)){st=2;td=0;[hx,hy]=pt(A,rr());hp('notificationOccurred','error');return 1}
if(d<-e.h&&!e.p){e.p=Dd;add(2);if(e.r!=p&&Dd-hd<.4)nr(e)}
return d>-e.h-.6})}
function dw(){let i,e,a,b,z,r,u;x.clearRect(0,0,W,H);x.drawImage(G,X-Y,0,H,H);
if(!(st%3)){for(i=0;i<5;i++)sp(i&1?2:1,...pt(i*1.26+.4,R[1]));sp(0,...pt(A,R[0]));return}
sp(4,X,Y,1+.05*M.sin(t*2.5)+cp*.35);
fx(5,X,Y,fl,30);if(cb%4||mu>1){x.strokeStyle=K.b;x.lineWidth=2;x.beginPath();x.arc(X,Y,17,-P/4,-P/4+(mu>4?P:cb%4*P/4));x.stroke()}
if(mu>1||pl>0){x.fillStyle=K.h;x.fillText(pl>0?'PHASE '+ph:'×'+mu,X,Y+36)}
x.strokeStyle=K.r;for(e of E){r=R[e.r];[a,b]=pt(e.a,r);
if(e.k==2){u=e.t<.6;x.lineWidth=u?1.5:5;i=u?e.h*e.t/.6:e.h;x.beginPath();x.arc(X,Y,r,e.a-i,e.a+i);x.stroke()}
else if(e.k==1){u=e.a+dr*.45;x.lineWidth=1.5;x.beginPath();x.arc(X,Y,r,e.a,u,dr<0);x.stroke();sp(3,a,b)}
else sp(e.k>2?1:2,a,b,M.min(1,.3+e.t*4))}
if(st==1||td<.06)sp(0,...pt(A,rr()))
else for(i=0;i<10;i++){u=t+i*.628;z=6+td*110;sp(7,hx+M.cos(u)*z,hy+M.sin(u)*z,1.2-td)}
fx(5,hx,hy,hT,2.5);fx(6,...pt(A,rr()),nf,3)}
function sch(){if(!ru&&!document.hidden){ru=1;let k=++gn;requestAnimationFrame(n=>k==gn&&lp(n))}}
function lp(n){ru=0;if(n-lt>(st%3?30:120)){let d=M.min(n-lt,130)/1e3;lt=n;for(ac+=d;ac>.0166;ac-=1/60)step(1/60);dw()}sch()}
function bd(r){let j;try{j=JSON.parse(r)}catch(e){}if(!j)return;if(j.e)y(j.e);if(j.b>best)ls('b',best=j.b);ui();if(!j.t)return;
$('l').textContent='Today  '+(j.t.map((p,i)=>i+1+'. '+p[0]+' '+p[1]).join(' · ')||'–')+'\n'+(j.r?'you #'+j.r+' of '+j.n+' · ':'')+(j.k?j.k+'-day streak':'')}
function rq(d){if(!L)return;y('syncing…');T.request(d).then(r=>{y('');if(d==pend)ls('p',pend='');bd(r.result)},e=>y(e.code))}
function sm(m){if(st%3)return;md=m;ls('m',m);for(const b of'de')$(b).className=b==m?'on':'';st=0;id();dw()}
function pc(){try{cd=JSON.parse(T.chatData)||{}}catch(e){cd={}}best=M.max(best,ls('b')|0,cd.best|0)}
c.onpointerdown=e=>{if(st-1)return;[hx,hy]=pt(A,rr());fr=rg;rg^=1;hT=0;hd=Dd;hp('selectionChanged');
for(const o of E)if(o.k<3&&o.p&&!o.n&&o.r==rg&&Dd-o.p<.35)nr(o)};
c.onclick=()=>{if(!L){try{T.openTelegramLink('https://t.me/fameOfBot?start=play')}catch(e){}return}
if(st%3||td<1.3)return;pend&&rq(pend);sz();go()};
th();pend=ls('p')||'';pc();sz();sm(ls('m')||'d');ui();
if(T){T.onEvent('themeChanged',()=>{th();bake();dw()});T.onEvent('chatDataChanged',()=>{pc();ui();st||id()});T.ready()}
if(L)rq(pend||'h');
document.addEventListener('visibilitychange',()=>{ru=0;document.hidden||sz();sch()});sch();
</script>
